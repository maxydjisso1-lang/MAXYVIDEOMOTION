[project]
name = "bve-py"
version = "0.1.0"
description = "Python sidecar of brand-video-engine: ML models without solid JS equivalents (speech-to-text)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "faster-whisper>=1.1,<2",
  "truststore>=0.10",
]

[tool.uv]
# The ML wheels (ctranslate2, onnxruntime) lag behind the newest Python releases.
python-preference = "managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bve_py"]
